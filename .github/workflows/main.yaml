name: Main CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API Package
    uses: ./.github/workflows/api.yaml
    secrets: inherit

  core:
    name: Core Package
    uses: ./.github/workflows/core.yaml
    secrets: inherit
    needs: api

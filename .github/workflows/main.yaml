name: Main CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  assets:
    name: Assets Package
    uses: ./.github/workflows/assets.yaml
    secrets: inherit

  api:
    name: API Package
    uses: ./.github/workflows/api.yaml
    secrets: inherit

  core:
    name: Core Package
    uses: ./.github/workflows/core.yaml
    secrets: inherit
    needs: [assets, api]

  js:
    name: JS Package
    uses: ./.github/workflows/js.yaml
    secrets: inherit
    needs: [api, core]
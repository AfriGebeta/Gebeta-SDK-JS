# Manual deploy only. Run from Actions tab: "Run workflow" > choose target.
# Only GitHub usernames in repo variable DEPLOY_ALLOWED_ACTORS can complete a deploy (Settings > Secrets and variables > Actions > Variables). Space-separated list.
name: Deploy

concurrency:
  group: deploy
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to deploy'
        required: true
        type: choice
        options:
          - assets
          - npm
        default: 'assets'

jobs:
  deploy-assets:
    name: Deploy Assets
    runs-on: ubuntu-latest
    if: inputs.target == 'assets'

    steps:
      - name: Check deploy permission
        run: |
          ALLOWED="${{ vars.DEPLOY_ALLOWED_ACTORS }}"
          if [ -z "$ALLOWED" ]; then
            echo "DEPLOY_ALLOWED_ACTORS variable is not set. Configure it in Settings > Variables."
            exit 1
          fi
          for u in $ALLOWED; do
            [ "$u" = "${{ github.actor }}" ] && exit 0
          done
          echo "Deploy is restricted to GitHub users: $ALLOWED"
          echo "Current user (github.actor): ${{ github.actor }}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify assets
        run: node packages/assets/scripts/verify-assets.js

      - name: Compute assets content hash
        id: assets-hash
        run: echo "hash=$(node packages/assets/scripts/content-hash.js)" >> $GITHUB_OUTPUT

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MAP_TILE_SERVER_SSH_KEY }}

      - name: Deploy Assets to Server
        env:
          SERVER_USER: ${{ secrets.MAP_TILE_SERVER_USER }}
          SERVER_IP: ${{ secrets.MAP_TILE_SERVER_IP }}
          ASSETS_HASH: ${{ steps.assets-hash.outputs.hash }}
        run: |
          CURRENT_HASH=$(ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cat ~/static/files/gebeta-maps-assets/current/.content-hash 2>/dev/null" || echo "")
          if [ "$CURRENT_HASH" = "$ASSETS_HASH" ]; then
            echo "Assets unchanged (hash: $ASSETS_HASH), skipping deploy"
            exit 0
          fi
          echo "Assets changed (was: $CURRENT_HASH, now: $ASSETS_HASH). Deploying to CDN..."
          NEW_VERSION=${{ github.sha }}
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/icons/maneuvers"
          scp -o StrictHostKeyChecking=no -r packages/assets/icons/maneuvers/* $SERVER_USER@$SERVER_IP:~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/icons/maneuvers
          echo "$ASSETS_HASH" | ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cat > ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/.content-hash"
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "ln -sfn ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION ~/static/files/gebeta-maps-assets/current"
          echo "Assets deployed successfully to https://assets.gebeta.app/icons/maneuvers/"

  deploy-npm:
    name: Release All SDKs to npm + CDN
    runs-on: ubuntu-latest
    if: inputs.target == 'npm'
    permissions:
      contents: write

    steps:
      - name: Check deploy permission
        run: |
          ALLOWED="${{ vars.DEPLOY_ALLOWED_ACTORS }}"
          if [ -z "$ALLOWED" ]; then
            echo "DEPLOY_ALLOWED_ACTORS variable is not set. Configure it in Settings > Variables."
            exit 1
          fi
          for u in $ALLOWED; do
            [ "$u" = "${{ github.actor }}" ] && exit 0
          done
          echo "Deploy is restricted to GitHub users: $ALLOWED"
          echo "Current user (github.actor): ${{ github.actor }}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Bump versions
        run: |
          if [ -z "$(ls .changeset/*.md 2>/dev/null | grep -v README)" ]; then
            echo "No changesets found. Create one with 'yarn changeset' before releasing."
            exit 1
          fi
          yarn version:packages

      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: release SDK packages [skip ci]"
          git push

      - name: Build all packages
        run: |
          yarn workspace @gebeta/api build
          yarn workspace @gebeta/core build
          yarn workspace @gebeta/js build
          yarn workspace @gebeta/react build
          yarn workspace @gebeta/react-native build
          yarn workspace @gebeta/node build

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          yarn config set npmAuthToken "${NPM_TOKEN}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          for pkg in packages/api packages/core packages/client/js packages/client/react packages/client/react-native packages/server/node; do
            echo "Publishing $pkg..."
            yarn workspace $(node -p "require('./$pkg/package.json').name") npm publish --access public --tolerate-republish || true
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get release version
        id: version
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('./packages/client/js/package.json','utf8')).version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version: $VERSION"

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MAP_TILE_SERVER_SSH_KEY }}

      - name: Deploy JS SDK to CDN
        env:
          SERVER_USER: ${{ secrets.MAP_TILE_SERVER_USER }}
          SERVER_IP: ${{ secrets.MAP_TILE_SERVER_IP }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Deploying JS SDK $RELEASE_VERSION to CDN"
          MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
          BASE=/root/static/files/gebeta-maps-lib
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p $BASE/releases/$RELEASE_VERSION"
          scp -o StrictHostKeyChecking=no -r packages/client/js/dist/* $SERVER_USER@$SERVER_IP:$BASE/releases/$RELEASE_VERSION
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "ln -sfn $BASE/releases/$RELEASE_VERSION $BASE/v$MAJOR && ln -sfn $BASE/releases/$RELEASE_VERSION $BASE/current"
          echo "JS SDK $RELEASE_VERSION deployed to:"
          echo "  https://tiles.gebeta.app/static/releases/$RELEASE_VERSION/gebeta-maps.umd.js  (pinned)"
          echo "  https://tiles.gebeta.app/static/v$MAJOR/gebeta-maps.umd.js                    (major)"
          echo "  https://tiles.gebeta.app/static/current/gebeta-maps.umd.js                    (latest)"

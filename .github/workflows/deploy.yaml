# Manual deploy only. Run from Actions tab: "Run workflow" > choose target.
# Only GitHub usernames in repo variable DEPLOY_ALLOWED_ACTORS can complete a deploy (Settings > Secrets and variables > Actions > Variables). Space-separated list.
name: Deploy

concurrency:
  group: deploy
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Package to deploy'
        required: true
        type: choice
        options:
          - assets
          - js
          - npm
        default: 'assets'

jobs:
  deploy-assets:
    name: Deploy Assets
    runs-on: ubuntu-latest
    if: inputs.target == 'assets'

    steps:
      - name: Check deploy permission
        run: |
          ALLOWED="${{ vars.DEPLOY_ALLOWED_ACTORS }}"
          for u in $ALLOWED; do
            [ "$u" = "${{ github.actor }}" ] && exit 0
          done
          echo "Deploy is restricted to GitHub users: $ALLOWED"
          echo "Current user (github.actor): ${{ github.actor }}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify assets
        run: node packages/assets/scripts/verify-assets.js

      - name: Compute assets content hash
        id: assets-hash
        run: echo "hash=$(node packages/assets/scripts/content-hash.js)" >> $GITHUB_OUTPUT

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MAP_TILE_SERVER_SSH_KEY }}

      - name: Deploy Assets to Server
        env:
          SERVER_USER: ${{ secrets.MAP_TILE_SERVER_USER }}
          SERVER_IP: ${{ secrets.MAP_TILE_SERVER_IP }}
          ASSETS_HASH: ${{ steps.assets-hash.outputs.hash }}
        run: |
          CURRENT_HASH=$(ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cat ~/static/files/gebeta-maps-assets/current/.content-hash 2>/dev/null" || echo "")
          if [ "$CURRENT_HASH" = "$ASSETS_HASH" ]; then
            echo "Assets unchanged (hash: $ASSETS_HASH), skipping deploy"
            exit 0
          fi
          echo "Assets changed (was: $CURRENT_HASH, now: $ASSETS_HASH). Deploying to CDN..."
          NEW_VERSION=${{ github.sha }}
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/icons/maneuvers"
          scp -o StrictHostKeyChecking=no -r packages/assets/icons/maneuvers/* $SERVER_USER@$SERVER_IP:~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/icons/maneuvers
          echo "$ASSETS_HASH" | ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cat > ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/.content-hash"
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "ln -sfn ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION ~/static/files/gebeta-maps-assets/current"
          echo "Assets deployed successfully to https://assets.gebeta.app/icons/maneuvers/"

  deploy-js:
    name: Deploy JS
    runs-on: ubuntu-latest
    if: inputs.target == 'js'

    steps:
      - name: Check deploy permission
        run: |
          ALLOWED="${{ vars.DEPLOY_ALLOWED_ACTORS }}"
          for u in $ALLOWED; do
            [ "$u" = "${{ github.actor }}" ] && exit 0
          done
          echo "Deploy is restricted to GitHub users: $ALLOWED"
          echo "Current user (github.actor): ${{ github.actor }}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build API package
        run: yarn workspace @gebeta/api build

      - name: Build Core package
        run: yarn workspace @gebeta/core build

      - name: Build JS package
        run: yarn workspace @gebeta/js build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MAP_TILE_SERVER_SSH_KEY }}

      - name: Deploy JS to Server
        env:
          SERVER_USER: ${{ secrets.MAP_TILE_SERVER_USER }}
          SERVER_IP: ${{ secrets.MAP_TILE_SERVER_IP }}
        run: |
          echo "Deploying JS SDK to CDN"
          NEW_VERSION=${{ github.sha }}
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p ~/static/files/gebeta-maps-lib/releases/$NEW_VERSION"
          scp -o StrictHostKeyChecking=no -r packages/client/js/dist/* $SERVER_USER@$SERVER_IP:~/static/files/gebeta-maps-lib/releases/$NEW_VERSION
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "ln -sfn ~/static/files/gebeta-maps-lib/releases/$NEW_VERSION ~/static/files/gebeta-maps-lib/current"
          echo "JS SDK deployed successfully"

  deploy-npm:
    name: Release All SDKs to npm + CDN
    runs-on: ubuntu-latest
    if: inputs.target == 'npm'
    permissions:
      contents: write

    steps:
      - name: Check deploy permission
        run: |
          ALLOWED="${{ vars.DEPLOY_ALLOWED_ACTORS }}"
          for u in $ALLOWED; do
            [ "$u" = "${{ github.actor }}" ] && exit 0
          done
          echo "Deploy is restricted to GitHub users: $ALLOWED"
          echo "Current user (github.actor): ${{ github.actor }}"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Bump versions
        run: yarn version:packages

      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release SDK packages [skip ci]"
          git push

      - name: Configure npm auth
        run: yarn config set npmAuthToken "$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: yarn release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Get release version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/client/js/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version: $VERSION"

      - name: Build API package
        run: yarn workspace @gebeta/api build

      - name: Build Core package
        run: yarn workspace @gebeta/core build

      - name: Build JS package
        run: yarn workspace @gebeta/js build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MAP_TILE_SERVER_SSH_KEY }}

      - name: Deploy JS SDK to CDN
        env:
          SERVER_USER: ${{ secrets.MAP_TILE_SERVER_USER }}
          SERVER_IP: ${{ secrets.MAP_TILE_SERVER_IP }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Deploying JS SDK $RELEASE_VERSION to CDN"
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p ~/static/files/gebeta-maps-lib/releases/$RELEASE_VERSION"
          scp -o StrictHostKeyChecking=no -r packages/client/js/dist/* $SERVER_USER@$SERVER_IP:~/static/files/gebeta-maps-lib/releases/$RELEASE_VERSION
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "ln -sfn ~/static/files/gebeta-maps-lib/releases/$RELEASE_VERSION ~/static/files/gebeta-maps-lib/current"
          echo "JS SDK $RELEASE_VERSION deployed successfully"

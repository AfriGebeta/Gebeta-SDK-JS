name: Assets Package CI

on:
  workflow_call:

jobs:
  verify:
    name: Verify Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify assets
        run: node packages/assets/scripts/verify-assets.js

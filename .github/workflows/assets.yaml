name: Assets Package CI

on:
  workflow_call:

jobs:
  verify:
    name: Verify Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify assets
        run: node packages/assets/scripts/verify-assets.js

  deploy:
    name: Deploy Assets to CDN
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Compute assets content hash
        id: assets-hash
        run: echo "hash=$(node packages/assets/scripts/content-hash.js)" >> $GITHUB_OUTPUT

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MAP_TILE_SERVER_SSH_KEY }}

      - name: Deploy Assets to Server
        env:
          SERVER_USER: ${{ secrets.MAP_TILE_SERVER_USER }}
          SERVER_IP: ${{ secrets.MAP_TILE_SERVER_IP }}
          ASSETS_HASH: ${{ steps.assets-hash.outputs.hash }}
        run: |
          CURRENT_HASH=$(ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cat ~/static/files/gebeta-maps-assets/current/.content-hash 2>/dev/null" || echo "")
          if [ "$CURRENT_HASH" = "$ASSETS_HASH" ]; then
            echo "Assets unchanged (hash: $ASSETS_HASH), skipping deploy"
            exit 0
          fi
          echo "Assets changed (was: $CURRENT_HASH, now: $ASSETS_HASH). Deploying to CDN..."
          NEW_VERSION=${{ github.sha }}
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/icons/maneuvers"
          scp -o StrictHostKeyChecking=no -r packages/assets/icons/maneuvers/* $SERVER_USER@$SERVER_IP:~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/icons/maneuvers
          echo "$ASSETS_HASH" | ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cat > ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION/.content-hash"
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "ln -sfn ~/static/files/gebeta-maps-assets/releases/$NEW_VERSION ~/static/files/gebeta-maps-assets/current"
          echo "Assets deployed successfully to https://assets.gebeta.app/icons/maneuvers/"

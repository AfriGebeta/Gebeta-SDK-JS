name: API Package CI

on:
  workflow_call:

jobs:
  lint-and-build:
    name: Lint, Format, and Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint on API package
        run: yarn workspace @gebeta/api lint

      - name: Check Prettier formatting on API package
        run: yarn workspace @gebeta/api format:check

      - name: Type check API package
        run: yarn workspace @gebeta/api typecheck

      - name: Build API package
        run: yarn workspace @gebeta/api build

      - name: Verify build output
        run: |
          if [ ! -f "packages/api/dist/index.js" ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi
          if [ ! -f "packages/api/dist/index.d.ts" ]; then
            echo "Build failed: dist/index.d.ts not found"
            exit 1
          fi
          echo "Build output verified successfully"
